<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Confirmación · EduClass</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#d4a017', 'primary-light': '#f4c430', 'background-dark': '#0f172a', 'background-card': '#1e293b' }, fontFamily: { display: ['Playfair Display'], sans: ['Inter'] } } } }
  </script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="confirmacion" class="bg-background-dark text-gray-200 font-sans">
  <div id="appHeader"></div>

  <main class="container mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <div class="max-w-3xl mx-auto" id="confirmContent"></div>
  </main>

  <div id="appFooter"></div>
  <script src="js/app.js"></script>
  <script>
    function pageInit() {
      const id = UI.getQueryParam('id');
      const container = document.getElementById('confirmContent');
      if (!id) {
        container.innerHTML = '<div class="text-center py-16"><h1 class="text-2xl font-bold text-white">Reserva no encontrada</h1><p class="text-gray-400 mt-2">No se proporcionó un ID de reserva válido.</p><a href="index.html" class="btn-primary mt-6">Volver al inicio</a></div>';
        return;
      }
      const r = Reservas.get(id);
      if (!r) {
        container.innerHTML = '<div class="text-center py-16"><h1 class="text-2xl font-bold text-white">Reserva no encontrada</h1><p class="text-gray-400 mt-2">No se pudo cargar la información.</p><a href="index.html" class="btn-primary mt-6">Volver al inicio</a></div>';
        return;
      }
      const s = UI.servicioById(r.servicioId);
      const p = UI.profesionalById(r.profesionalId);
      container.innerHTML = `
        <div class="text-center mb-10">
          <div class="checkmark-circle mx-auto mb-6">
            <div class="background"></div>
            <div class="checkmark"></div>
          </div>
          <p class="text-primary uppercase tracking-[0.3em] text-xs mb-2 font-medium">Reserva creada</p>
          <h1 class="text-4xl md:text-5xl font-bold text-white mb-3" style="font-family: 'Playfair Display', serif;">¡Casi listo!</h1>
          <p class="text-gray-300 max-w-xl mx-auto">Tu reserva ha sido registrada exitosamente. Realiza el pago para confirmarla.</p>
        </div>

        <div class="bg-background-card border border-primary/20 rounded-2xl overflow-hidden mb-6">
          <div class="bg-primary/5 border-b border-primary/20 p-5 flex items-center justify-between">
            <div>
              <p class="text-xs uppercase tracking-wider text-gray-400">Código de reserva</p>
              <p class="text-primary text-2xl font-bold" style="font-family: 'Playfair Display', serif;">#${r.id.toUpperCase()}</p>
            </div>
            <span class="px-4 py-1.5 rounded-full text-xs uppercase tracking-wider border ${UI.estadoBadge(r.estado).cls}">${UI.estadoBadge(r.estado).label}</span>
          </div>
          <div class="p-6 space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
              <div>
                <p class="text-xs uppercase tracking-wider text-gray-500 mb-1">Servicio</p>
                <p class="text-white font-semibold">${s.nombre}</p>
                <p class="text-gray-400 text-sm">${UI.categoriaById(s.categoria).label} · ${s.duracion} min</p>
              </div>
              <div>
                <p class="text-xs uppercase tracking-wider text-gray-500 mb-1">Tutor</p>
                <p class="text-white font-semibold">${p.nombre}</p>
                <p class="text-gray-400 text-sm">${p.rol}</p>
              </div>
              <div>
                <p class="text-xs uppercase tracking-wider text-gray-500 mb-1">Fecha</p>
                <p class="text-white font-semibold">${UI.formatDate(r.fecha)}</p>
              </div>
              <div>
                <p class="text-xs uppercase tracking-wider text-gray-500 mb-1">Hora</p>
                <p class="text-white font-semibold">${r.hora}</p>
              </div>
              <div>
                <p class="text-xs uppercase tracking-wider text-gray-500 mb-1">Modalidad</p>
                <p class="text-white font-semibold">${UI.modalidadLabel(r.modalidad)}</p>
              </div>
              <div>
                <p class="text-xs uppercase tracking-wider text-gray-500 mb-1">Pago</p>
                <p class="text-white font-semibold">${r.pago === 'pagado' ? 'Pagado' : 'Pendiente'}</p>
              </div>
            </div>
            ${r.notas ? `<div class="pt-4 border-t border-gray-800"><p class="text-xs uppercase tracking-wider text-gray-500 mb-1">Notas</p><p class="text-gray-300 text-sm">${r.notas}</p></div>` : ''}
            <div class="pt-4 border-t border-gray-800 flex items-center justify-between">
              <p class="text-white font-semibold">Total a pagar</p>
              <p class="text-primary text-3xl font-bold" style="font-family: 'Playfair Display', serif;">${UI.formatPrice(r.precio)}</p>
            </div>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <a href="pago.html?id=${r.id}" class="btn-primary justify-center w-full">
            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path></svg>
            Ir a pagar
          </a>
          <a href="perfil.html" class="btn-outline justify-center w-full">Ver mis reservas</a>
        </div>

        <div class="mt-8 bg-background-card/50 border border-gray-800 rounded-xl p-5 text-sm text-gray-400">
          <p class="text-white font-semibold mb-2">Información importante:</p>
          <ul class="space-y-1 list-disc">
            <li>Recibirás un correo con los datos de tu reserva.</li>
            <li>Puedes cancelar hasta 12 horas antes sin costo.</li>
            <li>Si elegiste modalidad online, recibirás el enlace de la clase 1 hora antes del inicio.</li>
          </ul>
        </div>
      `;
    }
  </script>
</body>
</html>
