<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro · EduClass</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#d4a017', 'primary-light': '#f4c430', 'background-dark': '#0f172a', 'background-card': '#1e293b' }, fontFamily: { display: ['Playfair Display'], sans: ['Inter'] } } } }
  </script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="registro" class="bg-background-dark text-gray-200 font-sans">
  <div id="appHeader"></div>

  <main class="container mx-auto px-4 py-12">
    <div class="max-w-md mx-auto">
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center h-16 w-16 rounded-2xl bg-primary/10 border border-primary/30 mb-4">
          <svg class="h-8 w-8 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path></svg>
        </div>
        <h1 class="text-3xl font-bold text-white mb-2" style="font-family: 'Playfair Display', serif;">Crea tu cuenta</h1>
        <p class="text-gray-400">Únete y empieza a aprender con los mejores tutores</p>
      </div>

      <div class="bg-background-card border border-gray-800 rounded-2xl p-6 md:p-8">
        <form id="regForm" class="space-y-5">
          <div>
            <label class="block text-sm text-gray-300 mb-1">Nombre completo</label>
            <input id="regNombre" type="text" required minlength="3" class="w-full bg-background-dark border border-gray-700 rounded-lg px-4 py-3 text-white focus:border-primary focus:ring-primary" placeholder="Tu nombre"/>
          </div>
          <div>
            <label class="block text-sm text-gray-300 mb-1">Email</label>
            <input id="regEmail" type="email" required class="w-full bg-background-dark border border-gray-700 rounded-lg px-4 py-3 text-white focus:border-primary focus:ring-primary" placeholder="tu@email.com"/>
          </div>
          <div>
            <label class="block text-sm text-gray-300 mb-1">Teléfono</label>
            <input id="regTel" type="tel" class="w-full bg-background-dark border border-gray-700 rounded-lg px-4 py-3 text-white focus:border-primary focus:ring-primary" placeholder="+51 999 000 000"/>
          </div>
          <div>
            <label class="block text-sm text-gray-300 mb-1">Contraseña</label>
            <input id="regPass" type="password" required minlength="6" class="w-full bg-background-dark border border-gray-700 rounded-lg px-4 py-3 text-white focus:border-primary focus:ring-primary" placeholder="Mínimo 6 caracteres"/>
          </div>
          <div>
            <label class="block text-sm text-gray-300 mb-1">Confirmar contraseña</label>
            <input id="regPass2" type="password" required minlength="6" class="w-full bg-background-dark border border-gray-700 rounded-lg px-4 py-3 text-white focus:border-primary focus:ring-primary" placeholder="Repite tu contraseña"/>
          </div>
          <div class="flex items-start">
            <input id="acepta" type="checkbox" required class="mt-1 rounded border-gray-600 text-primary focus:ring-primary bg-background-dark"/>
            <label for="acepta" class="ml-2 text-sm text-gray-400">Acepto los <a href="terminos.html" class="text-primary hover:text-primary-light">Términos y Condiciones</a> y la <a href="privacidad.html" class="text-primary hover:text-primary-light">Política de Privacidad</a></label>
          </div>
          <button type="submit" class="btn-primary w-full justify-center py-3">Crear cuenta</button>
        </form>

        <div class="text-center mt-6">
          <p class="text-gray-400 text-sm">¿Ya tienes cuenta? <a href="inicio-sesion.html" class="text-primary hover:text-primary-light font-semibold">Ingresa aquí</a></p>
        </div>
      </div>
    </div>
  </main>

  <div id="appFooter"></div>
  <script src="js/app.js"></script>
  <script>
    function pageInit() {
      document.getElementById('regForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const pass = document.getElementById('regPass').value;
        const pass2 = document.getElementById('regPass2').value;
        if (pass !== pass2) { UI.toast('Las contraseñas no coinciden', 'error'); return; }
        const result = Auth.register({
          nombre: document.getElementById('regNombre').value,
          email: document.getElementById('regEmail').value,
          telefono: document.getElementById('regTel').value,
          password: pass
        });
        if (!result.ok) { UI.toast(result.error, 'error'); return; }
        UI.toast('¡Bienvenido a EduClass!');
        setTimeout(() => window.location.href = 'perfil.html', 700);
      });
    }
  </script>
</body>
</html>
