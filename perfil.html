<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi Perfil · EduClass</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#d4a017', 'primary-light': '#f4c430', 'background-dark': '#0f172a', 'background-card': '#1e293b' }, fontFamily: { display: ['Playfair Display'], sans: ['Inter'] } } } }
  </script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="perfil" class="bg-background-dark text-gray-200 font-sans">
  <div id="appHeader"></div>

  <main class="container mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <div class="max-w-6xl mx-auto">
      <div class="bg-background-card border border-primary/20 rounded-2xl overflow-hidden mb-8">
        <div class="bg-gradient-to-r from-primary/10 via-primary/5 to-transparent p-6 md:p-8 flex flex-col md:flex-row items-start md:items-center gap-6">
          <img id="userFoto" src="" class="h-24 w-24 rounded-full object-cover border-4 border-primary/40 shadow-xl"/>
          <div class="flex-1">
            <p class="text-primary uppercase tracking-[0.3em] text-xs mb-1 font-medium">Mi cuenta</p>
            <h1 class="text-3xl md:text-4xl font-bold text-white mb-1" style="font-family: 'Playfair Display', serif;" id="userNombre">—</h1>
            <p class="text-gray-400 text-sm" id="userEmail">—</p>
          </div>
          <div class="grid grid-cols-3 gap-4 w-full md:w-auto">
            <div class="text-center">
              <p class="text-primary text-2xl font-bold" style="font-family: 'Playfair Display', serif;" id="statTotal">0</p>
              <p class="text-gray-400 text-xs uppercase">Reservas</p>
            </div>
            <div class="text-center">
              <p class="text-emerald-400 text-2xl font-bold" style="font-family: 'Playfair Display', serif;" id="statCompletadas">0</p>
              <p class="text-gray-400 text-xs uppercase">Completadas</p>
            </div>
            <div class="text-center">
              <p class="text-blue-400 text-2xl font-bold" style="font-family: 'Playfair Display', serif;" id="statPendientes">0</p>
              <p class="text-gray-400 text-xs uppercase">Pendientes</p>
            </div>
          </div>
        </div>
      </div>

      <div class="border-b border-gray-800 mb-6 flex gap-1 overflow-x-auto" id="tabs">
        <button data-tab="reservas" class="tab-btn active px-5 py-3 text-sm font-medium text-gray-300 hover:text-primary">Mis reservas</button>
        <button data-tab="cuenta" class="tab-btn px-5 py-3 text-sm font-medium text-gray-300 hover:text-primary">Mi cuenta</button>
      </div>

      <div id="tabContent"></div>
    </div>
  </main>

  <div id="appFooter"></div>
  <script src="js/app.js"></script>
  <script>
    function pageInit() {
      if (!UI.requireAuth('perfil.html')) return;
      const user = Auth.current();
      const all = Reservas.listByUser(user.id);
      document.getElementById('userFoto').src = user.foto;
      document.getElementById('userNombre').textContent = user.nombre;
      document.getElementById('userEmail').textContent = user.email;
      document.getElementById('statTotal').textContent = all.length;
      document.getElementById('statCompletadas').textContent = all.filter(r => r.estado === 'completada').length;
      document.getElementById('statPendientes').textContent = all.filter(r => ['pendiente', 'confirmada'].includes(r.estado)).length;

      let activeTab = 'reservas';

      function renderReservas() {
        const container = document.getElementById('tabContent');
        if (all.length === 0) {
          container.innerHTML = `
            <div class="text-center py-16 bg-background-card border border-gray-800 rounded-2xl">
              <svg class="h-16 w-16 text-gray-600 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
              <h3 class="text-white font-semibold text-xl mb-2">Aún no tienes reservas</h3>
              <p class="text-gray-400 mb-6">Empieza reservando tu primera clase con nosotros</p>
              <a href="reserva.html" class="btn-primary">Reservar clase</a>
            </div>`;
          return;
        }
        container.innerHTML = '<div class="grid grid-cols-1 md:grid-cols-2 gap-4">' + all.map(r => {
          const s = UI.servicioById(r.servicioId);
          const p = UI.profesionalById(r.profesionalId);
          const est = UI.estadoBadge(r.estado);
          const pag = UI.pagoBadge(r.pago);
          const isPast = UI.isPastDate(r.fecha) && r.estado !== 'completada';
          return `
            <div class="bg-background-card border border-gray-800 rounded-xl overflow-hidden card-hover">
              <div class="p-5">
                <div class="flex items-start gap-4 mb-4">
                  <img src="${s.imagen}" class="h-16 w-16 rounded-lg object-cover"/>
                  <div class="flex-1">
                    <p class="text-white font-semibold">${s.nombre}</p>
                    <p class="text-gray-400 text-xs">${p.nombre} · ${UI.modalidadLabel(r.modalidad)}</p>
                    <p class="text-gray-400 text-xs mt-1">${UI.formatDate(r.fecha)} · ${r.hora}</p>
                  </div>
                </div>
                <div class="flex flex-wrap gap-2 mb-4">
                  <span class="text-xs px-2.5 py-1 rounded-full border ${est.cls}">${est.label}</span>
                  <span class="text-xs px-2.5 py-1 rounded-full border ${pag.cls}">${pag.label}</span>
                  ${isPast ? '<span class="text-xs px-2.5 py-1 rounded-full border bg-slate-500/20 text-slate-300 border-slate-500/30">Vencida</span>' : ''}
                </div>
                <div class="flex items-center justify-between pt-3 border-t border-gray-800">
                  <p class="text-primary font-bold text-xl" style="font-family: 'Playfair Display', serif;">${UI.formatPrice(r.precio)}</p>
                  <a href="detalle-reserva.html?id=${r.id}" class="text-primary text-sm font-semibold hover:text-primary-light transition-colors">Ver detalle →</a>
                </div>
              </div>
            </div>`;
        }).join('') + '</div>';
      }

      function renderCuenta() {
        const container = document.getElementById('tabContent');
        container.innerHTML = `
          <div class="bg-background-card border border-gray-800 rounded-2xl p-6 md:p-8 max-w-2xl">
            <h2 class="text-2xl font-bold text-white mb-1" style="font-family: 'Playfair Display', serif;">Datos personales</h2>
            <p class="text-gray-400 text-sm mb-6">Actualiza tu información personal</p>
            <form id="formCuenta" class="space-y-4">
              <div>
                <label class="block text-sm text-gray-300 mb-1">Nombre completo</label>
                <input id="cf-nombre" value="${user.nombre}" required class="w-full bg-background-dark border border-gray-700 rounded-lg px-4 py-3 text-white"/>
              </div>
              <div>
                <label class="block text-sm text-gray-300 mb-1">Email</label>
                <input value="${user.email}" disabled class="w-full bg-background-dark border border-gray-700 rounded-lg px-4 py-3 text-gray-500"/>
                <p class="text-xs text-gray-500 mt-1">El email no puede ser modificado</p>
              </div>
              <div>
                <label class="block text-sm text-gray-300 mb-1">Teléfono</label>
                <input id="cf-tel" value="${user.telefono || ''}" class="w-full bg-background-dark border border-gray-700 rounded-lg px-4 py-3 text-white" placeholder="+51 999 000 000"/>
              </div>
              <div class="pt-3 border-t border-gray-800 flex items-center justify-between">
                <button type="submit" class="btn-primary">Guardar cambios</button>
                <a href="#" id="btnSalirCuenta" class="text-red-400 hover:text-red-300 text-sm font-medium">Cerrar sesión</a>
              </div>
            </form>
          </div>`;
        document.getElementById('formCuenta').addEventListener('submit', (e) => {
          e.preventDefault();
          const result = Auth.update(user.id, {
            nombre: document.getElementById('cf-nombre').value,
            telefono: document.getElementById('cf-tel').value
          });
          if (result.ok) {
            UI.toast('Datos actualizados correctamente');
            setTimeout(() => window.location.reload(), 700);
          }
        });
        document.getElementById('btnSalirCuenta').addEventListener('click', (e) => {
          e.preventDefault();
          Auth.logout();
          UI.toast('Sesión cerrada');
          setTimeout(() => window.location.href = 'index.html', 700);
        });
      }

      function render() {
        document.querySelectorAll('#tabs button').forEach(b => {
          b.classList.toggle('active', b.dataset.tab === activeTab);
        });
        if (activeTab === 'reservas') renderReservas();
        else renderCuenta();
      }

      document.querySelectorAll('#tabs button').forEach(b => {
        b.addEventListener('click', () => { activeTab = b.dataset.tab; render(); });
      });
      render();
    }
  </script>
</body>
</html>
