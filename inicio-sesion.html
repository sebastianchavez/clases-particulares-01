<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión · EduClass</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#d4a017', 'primary-light': '#f4c430', 'background-dark': '#0f172a', 'background-card': '#1e293b' }, fontFamily: { display: ['Playfair Display'], sans: ['Inter'] } } } }
  </script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="inicio-sesion" class="bg-background-dark text-gray-200 font-sans">
  <div id="appHeader"></div>

  <main class="container mx-auto px-4 py-12">
    <div class="max-w-md mx-auto">
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center h-16 w-16 rounded-2xl bg-primary/10 border border-primary/30 mb-4">
          <svg class="h-8 w-8 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path></svg>
        </div>
        <h1 class="text-3xl font-bold text-white mb-2" style="font-family: 'Playfair Display', serif;">Bienvenido de vuelta</h1>
        <p class="text-gray-400">Ingresa a tu cuenta para acceder a tus reservas</p>
      </div>

      <div class="bg-background-card border border-gray-800 rounded-2xl p-6 md:p-8">
        <form id="loginForm" class="space-y-5">
          <div>
            <label class="block text-sm text-gray-300 mb-1">Email</label>
            <input id="loginEmail" type="email" required class="w-full bg-background-dark border border-gray-700 rounded-lg px-4 py-3 text-white focus:border-primary focus:ring-primary" placeholder="tu@email.com"/>
          </div>
          <div>
            <div class="flex items-center justify-between mb-1">
              <label class="block text-sm text-gray-300">Contraseña</label>
              <a href="recuperar-password.html" class="text-xs text-primary hover:text-primary-light">¿Olvidaste tu contraseña?</a>
            </div>
            <input id="loginPass" type="password" required class="w-full bg-background-dark border border-gray-700 rounded-lg px-4 py-3 text-white focus:border-primary focus:ring-primary" placeholder="••••••••"/>
          </div>
          <div class="flex items-center">
            <input id="remember" type="checkbox" class="rounded border-gray-600 text-primary focus:ring-primary bg-background-dark"/>
            <label for="remember" class="ml-2 text-sm text-gray-400">Recordarme</label>
          </div>
          <button type="submit" class="btn-primary w-full justify-center py-3">Ingresar</button>
        </form>

        <div class="text-center mt-6">
          <p class="text-gray-400 text-sm">¿No tienes cuenta? <a href="registro.html" class="text-primary hover:text-primary-light font-semibold">Regístrate aquí</a></p>
        </div>
      </div>

      <div class="mt-6 bg-primary/5 border border-primary/30 rounded-xl p-4 text-sm">
        <p class="text-white font-semibold mb-2 flex items-center gap-2">
          <svg class="h-4 w-4 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
          Cuentas de prueba
        </p>
        <p class="text-gray-300 text-xs mb-1">Usuario: <span class="text-primary font-mono">juan@test.com</span></p>
        <p class="text-gray-300 text-xs mb-2">Contraseña: <span class="text-primary font-mono">123456</span></p>
        <button type="button" id="btnDemo" class="text-xs px-3 py-1.5 rounded bg-primary/10 border border-primary/30 text-primary hover:bg-primary/20">Usar cuenta demo</button>
      </div>
    </div>
  </main>

  <div id="appFooter"></div>
  <script src="js/app.js"></script>
  <script>
    function pageInit() {
      if (Auth.isLogged()) {
        const r = UI.getRedirect();
        window.location.href = r || 'perfil.html';
        return;
      }
      document.getElementById('loginForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const result = Auth.login(document.getElementById('loginEmail').value, document.getElementById('loginPass').value);
        if (!result.ok) { UI.toast(result.error, 'error'); return; }
        UI.toast('Bienvenido de vuelta, ' + result.user.nombre.split(' ')[0]);
        const r = UI.getRedirect();
        setTimeout(() => window.location.href = r || 'perfil.html', 600);
      });
      document.getElementById('btnDemo').addEventListener('click', () => {
        document.getElementById('loginEmail').value = 'juan@test.com';
        document.getElementById('loginPass').value = '123456';
      });
    }
  </script>
</body>
</html>
